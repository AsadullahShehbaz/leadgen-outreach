# Local development stack with live code reload.
#
# Start from the repository root:
#   docker compose -f docker-compose.dev.yml up --build
#
# Open:
#   Frontend  http://localhost:5173
#   API docs  http://localhost:8000/docs
#   Health    http://localhost:8000/health
#
# Stop without deleting data:
#   docker compose -f docker-compose.dev.yml down
#
# Delete the local database and Redis data (destructive):
#   docker compose -f docker-compose.dev.yml down -v

name: leadgen-dev

services:
  api:
    build:
      context: ./backend
    image: leadgen-dev
    restart: unless-stopped
    env_file:
      - ./deploy/.env.dev
    environment:
      # Docker Desktop on Windows does not always forward file events into the
      # container. Polling makes auto-reload reliable for both API and worker.
      WATCHFILES_FORCE_POLLING: "true"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    volumes:
      # Bind mount the backend source so edits are picked up without rebuilding.
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ./backend
    image: leadgen-dev
    restart: unless-stopped
    env_file:
      - ./deploy/.env.dev
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    # watchfiles restarts the whole ARQ process so app modules are re-imported.
    command: watchfiles --filter python "arq app.workers.arq_settings.WorkerSettings" app
    volumes:
      # Same source mount as the API so background jobs reload on edits.
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The API healthcheck does not apply to the worker process.
    healthcheck:
      disable: true

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      # Vite runs inside Docker, so it must reach the API by service name.
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    volumes:
      # Bind mount the frontend source for hot module reload.
      - ./frontend:/app
      # Keep Linux node_modules inside Docker instead of the Windows host.
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: leadgen
      POSTGRES_USER: leadgen
      # Local development only. Keep this in sync with deploy/.env.dev.
      POSTGRES_PASSWORD: leadgen_dev_password
    ports:
      # Exposed only for local inspection with a database client.
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadgen -d leadgen"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # Exposed only for local inspection with redis-cli.
      - "6379:6379"
    volumes:
      - redisdata_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata_dev:
  redisdata_dev:
  frontend_node_modules:
